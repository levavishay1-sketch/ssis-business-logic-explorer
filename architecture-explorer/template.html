<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
/* Design plan. Concept: a calm working notebook. The flow is a vertical timeline (rail + numbered nodes), cards are soft white surfaces,
   colour is used only to say what kind of thing something is (agent / code tool / you / proposed / output file).
   Type: Heebo-first system stack, scale 12.5 / 14.5 / 17 / 26, weights 500 and 700. Neutrals lean slightly blue. */
:root{--font:"Heebo","Assistant","Segoe UI","Noto Sans Hebrew",system-ui,-apple-system,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
--bg:#f5f6f9;--surface:#fff;--ink:#1c2333;--mut:#677085;--line:#e5e8ef;--soft:#eef0f5;--acc:#3b5bdb;--navy:#1f2f63;--navy-t:#c9d3f5;
--sh:0 1px 2px rgba(23,32,60,.06),0 10px 28px -16px rgba(23,32,60,.18);--r:16px;
--agent-s:#5865d6;--agent-t:#eceeff;--agent-d:#3340a8;--tool-s:#2c9a68;--tool-t:#e5f5ec;--tool-d:#17653f;--user-s:#dc7430;--user-t:#ffefe0;--user-d:#9a4a14;
--prop-s:#8a79cf;--prop-t:#f0edfb;--prop-d:#5a48a8;--file-s:#c49a1c;--file-t:#fbf3d9;--file-d:#7a5d0a;--gray-s:#98a1b3;--gray-t:#eef0f4;--gray-d:#424b5e;
--warn-t:#fff1cf;--warn-d:#8e5a00;--bad-t:#fde7e4;--bad-d:#b42318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1117;--surface:#171b24;--ink:#e9ecf3;--mut:#98a2b3;--line:#262b37;--soft:#222733;--acc:#8b95ff;--navy:#1d2a52;--navy-t:#b9c6f5;
--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.6);
--agent-s:#8b95ff;--agent-t:#232a55;--agent-d:#cdd2ff;--tool-s:#43c88a;--tool-t:#153a2b;--tool-d:#aeebcb;--user-s:#ff9a5c;--user-t:#46250f;--user-d:#ffd9bf;
--prop-s:#ad9bf0;--prop-t:#2b2548;--prop-d:#ddd3ff;--file-s:#f0c13a;--file-t:#3a3010;--file-d:#fbe7a1;--gray-s:#6f788c;--gray-t:#272b35;--gray-d:#d3d8e2;
--warn-t:#3d2e0b;--warn-d:#fdb022;--bad-t:#40201d;--bad-d:#ff8b80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1117;--surface:#171b24;--ink:#e9ecf3;--mut:#98a2b3;--line:#262b37;--soft:#222733;--acc:#8b95ff;--navy:#1d2a52;--navy-t:#b9c6f5;
--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.6);
--agent-s:#8b95ff;--agent-t:#232a55;--agent-d:#cdd2ff;--tool-s:#43c88a;--tool-t:#153a2b;--tool-d:#aeebcb;--user-s:#ff9a5c;--user-t:#46250f;--user-d:#ffd9bf;
--prop-s:#ad9bf0;--prop-t:#2b2548;--prop-d:#ddd3ff;--file-s:#f0c13a;--file-t:#3a3010;--file-d:#fbe7a1;--gray-s:#6f788c;--gray-t:#272b35;--gray-d:#d3d8e2;
--warn-t:#3d2e0b;--warn-d:#fdb022;--bad-t:#40201d;--bad-d:#ff8b80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;line-height:1.3;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}.sub{color:var(--mut);font-size:13px;margin-top:2px}
button{font:inherit;cursor:pointer;border:0;background:transparent;color:var(--ink);border-radius:10px;padding:7px 14px;transition:background .15s,box-shadow .15s}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#theme{background:var(--surface);box-shadow:var(--sh);color:var(--mut);padding:7px 12px;font-size:13px}#theme:hover{color:var(--ink)}
.kpis{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0 0 20px;color:var(--mut);font-size:13px}.kpi b{color:var(--ink);font-size:17px;font-weight:700;margin-inline-end:5px}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:22px}
.tabs button{border-radius:10px;color:var(--mut);font-weight:500;padding:7px 16px}.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(23,32,60,.12);font-weight:700}
section.tab{display:none}section.tab.on{display:block}
.chip{display:inline-block;background:var(--gray-t);color:var(--gray-d);border-radius:8px;padding:1px 9px;font-size:12.5px;margin:3px 0 3px 6px;white-space:nowrap;line-height:1.7}
.chip.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-size:11.5px;border-radius:7px}
.chip.agent{background:var(--agent-t);color:var(--agent-d)}.chip.tool{background:var(--tool-t);color:var(--tool-d)}.chip.file{background:var(--file-t);color:var(--file-d)}
.chip.prop{background:var(--prop-t);color:var(--prop-d)}.chip.user{background:var(--user-t);color:var(--user-d)}.chip.warn{background:var(--warn-t);color:var(--warn-d)}.chip.bad{background:var(--bad-t);color:var(--bad-d)}
.chip[data-ref]{cursor:pointer;transition:transform .12s,box-shadow .12s}.chip[data-ref]:hover{transform:translateY(-1px)}
.chip.hl{box-shadow:0 0 0 2px var(--acc)}
.orch{background:var(--navy);color:#fff;border-radius:var(--r);padding:16px 20px;box-shadow:var(--sh);margin-bottom:6px}.orch b{font-size:16px}.orch p{margin:4px 0 0;color:var(--navy-t);font-size:13.5px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}.ctl button{background:var(--surface);box-shadow:var(--sh);font-size:13px;padding:6px 13px}.ctl button.on{background:var(--acc);color:#fff}.ctl .sp{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mut);margin:6px 0 18px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.conn{height:16px}.conn i{display:none}
.step{--k-s:var(--gray-s);--k-t:var(--gray-t);--k-d:var(--gray-d);position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px 20px;margin-inline-start:46px;transition:opacity .2s,box-shadow .2s}
.step.k-tool{--k-s:var(--tool-s);--k-t:var(--tool-t);--k-d:var(--tool-d)}.step.k-agent{--k-s:var(--agent-s);--k-t:var(--agent-t);--k-d:var(--agent-d)}.step.k-user{--k-s:var(--user-s);--k-t:var(--user-t);--k-d:var(--user-d)}
.step.proposed{--k-s:var(--prop-s);--k-t:var(--prop-t);--k-d:var(--prop-d);background:var(--surface);outline:1.5px dashed var(--prop-s);outline-offset:-1.5px}
.step::before{content:"";position:absolute;inset-inline-start:-32px;top:30px;bottom:-16px;width:2px;background:var(--line)}.step.last::before{display:none}
.step.dim{opacity:.32}.step.active{box-shadow:0 0 0 2px var(--k-s),var(--sh)}
.step h3{margin:0;font-size:17px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:2px 0}
.step .num{position:absolute;inset-inline-start:-46px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--k-s);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;box-shadow:0 0 0 4px var(--bg)}
.step p{margin:4px 0 8px;color:var(--mut);font-size:14px}
.row{margin:6px 0}.row .lab{font-size:12px;font-weight:700;color:var(--mut);margin-inline-end:6px}
.agents2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;margin-top:8px}
.mini{background:var(--k-t);border-radius:12px;padding:10px 12px;min-width:0}.mini .chip:not(.agent):not(.warn):not(.bad):not(.tool){background:var(--surface)}
.loop{margin:10px 0 10px 0;margin-inline-start:46px;padding:9px 14px;background:var(--bad-t);color:var(--bad-d);border-radius:12px;font-size:13px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px 20px;margin-bottom:12px}.card.flash{box-shadow:0 0 0 3px var(--acc),var(--sh)}
.card h3{margin:0 0 2px;font-size:16.5px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center}.card .d{color:var(--mut);font-size:13.5px;margin:4px 0}
.card.prop{outline:1.5px dashed var(--prop-s);outline-offset:-1.5px}
details.d summary{cursor:pointer;color:var(--acc);font-size:12.5px}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}th{color:var(--mut);font-size:12px;font-weight:700}tr:last-child td{border-bottom:0}
tr.flash td{background:var(--warn-t)}
input[type=search]{font:inherit;padding:9px 14px;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--sh);color:var(--ink);width:100%;max-width:340px;margin-bottom:14px}
.sev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.sev:last-child{border-bottom:0}
ul.h{margin:8px 0 2px;padding-inline-start:18px;font-size:13.5px;color:var(--mut)}
footer{color:var(--mut);font-size:12.5px;margin-top:26px}
.more{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.more>summary{cursor:pointer;color:var(--acc);font-size:13px;font-weight:500;padding:4px 0;list-style:none}.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"◂ ";display:inline-block;transition:transform .15s}.more[open]>summary::before{transform:rotate(-90deg)}
.blk{display:grid;gap:12px;padding:8px 0 2px}.blk .sec h4{margin:0 0 3px;font-size:12px;font-weight:700;color:var(--mut)}
.blk ul,.blk ol{margin:0;padding-inline-start:20px;font-size:13.5px}.blk li{margin:2px 0}.blk p{margin:0;font-size:13.5px}
.blk .use{direction:ltr;text-align:left;font-family:var(--mono);font-size:12px;background:var(--soft);border-radius:10px;padding:8px 12px;white-space:pre-wrap;overflow-x:auto;unicode-bidi:isolate}
.blk .gate{background:var(--warn-t);color:var(--warn-d);border-radius:10px;padding:8px 12px;font-size:13.5px}
.blk .orig{direction:ltr;text-align:left;font-family:var(--mono);font-size:11.5px;color:var(--mut);white-space:pre-wrap;unicode-bidi:isolate}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.bar button{background:var(--surface);box-shadow:var(--sh);font-size:13px;padding:6px 13px}
tr.dt>td{background:var(--soft);padding:4px 18px 14px}
.tgl{background:var(--soft);color:var(--acc);font-size:12px;padding:1px 9px;border-radius:8px;margin-inline-start:6px}
@media (max-width:560px){h1{font-size:21px}.step{padding:14px 14px;margin-inline-start:40px}.step .num{inset-inline-start:-40px;width:28px;height:28px}.step::before{inset-inline-start:-27px}.loop{margin-inline-start:40px}.tabs button{padding:7px 11px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div><button id="theme" aria-label="החלפת ערכת נושא">◐ ערכת נושא</button></header>
<div class="kpis" id="kpis"></div>
<nav class="tabs" role="tablist" id="tabs"></nav>
<section class="tab" id="t-flow"></section>
<section class="tab" id="t-agents"></section>
<section class="tab" id="t-tools"></section>
<section class="tab" id="t-rules"></section>
<section class="tab" id="t-health"></section>
<footer id="foot"></footer>
</div>
<script>
const D = __DATA__;
const S = D.scan, M = D.manifest || { steps: [], loops: [] };
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text, attrs) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
// Hebrew text with embedded Latin names: isolate each Latin run (paths, identifiers, phrases) so the bidi algorithm keeps its order
const W = '(?:(?<![\\u0590-\\u05FF])-{1,2})?[A-Za-z][A-Za-z0-9_<>*\\/.\\-\\[\\]=|$#@:+()]*';
const LTRRE = new RegExp(W + '(?: ' + W + ')*', 'g');
function rich(text) {
  const f = document.createDocumentFragment(); let last = 0; text = String(text);
  for (const m of text.matchAll(LTRRE)) {
    let tok = m[0], tail = ''; const tm = /[.:,)(\-]+$/.exec(tok); if (tm) { tail = tm[0]; tok = tok.slice(0, -tail.length); }
    if (!tok) continue; if (m.index > last) f.append(text.slice(last, m.index));
    const b = document.createElement('bdi'); b.dir = 'ltr'; b.textContent = tok; f.append(b); last = m.index + tok.length;
  }
  if (last < text.length) f.append(text.slice(last)); return f;
}
const elr = (tag, cls, text) => { const e = el(tag, cls); e.append(rich(text)); return e; };
const chip = (text, cls, ref, title) => { const c = el('span', 'chip ' + (cls || ''), text); if (ref) { c.dataset.ref = ref; c.addEventListener('mouseenter', () => hl(ref)); c.addEventListener('mouseleave', () => hl(null)); c.addEventListener('click', () => jump(ref)); } if (title) c.title = title; return c; };
const TD = M.descriptions || {};
const TIPS = { Read: 'קורא קובץ', Grep: 'מחפש טקסט בקבצים', Glob: 'מוצא קבצים לפי שם', Bash: 'מריץ פקודות', Write: 'כותב קובץ חדש', Edit: 'עורך קובץ קיים', Agent: 'מפעיל סוכן' };
const scriptDesc = (n) => { const he = (TD.scripts || {})[n]; if (he) return he; const s = S.scripts.find((x) => x.name === n); return s && s.description ? s.description : null; };
const agentOf = (n) => S.agents.find((a) => a.name === n);
const DET = TD_DET();
function TD_DET() { return (M.details || {}); }
const LABELS = [['goal', 'מטרה'], ['inputs', 'קלט'], ['how', 'איך זה עובד'], ['outputs', 'פלט'], ['rules', 'כללים'], ['limits', 'גבולות'], ['gate', 'שער מעבר'], ['notes', 'הערות']];
function block(d, orig) {
  if (!d) return null;
  const w = el('div', 'blk');
  if (d.usage) { const s = el('div', 'sec'); s.append(el('h4', '', 'הרצה'), el('div', 'use', d.usage)); w.append(s); }
  LABELS.forEach(([k, l]) => {
    const v = d[k]; if (!v || (Array.isArray(v) && !v.length)) return;
    const s = el('div', 'sec'); s.append(el('h4', '', l));
    if (k === 'goal') s.append(elr('p', '', v)); else if (k === 'gate') s.append(elr('div', 'gate', v));
    else { const L = el(k === 'how' ? 'ol' : 'ul'); v.forEach((x) => L.append(elr('li', '', x))); s.append(L); }
    w.append(s);
  });
  if (orig && orig.length) { const dt = el('details'); dt.append(el('summary', 'sub', 'הערת הכותרת המקורית בקובץ (באנגלית)'), el('div', 'orig', orig.join('\n'))); w.append(dt); }
  return w;
}
const more = (d, label, open, orig) => { const b = block(d, orig); if (!b) return null; const dt = el('details', 'more'); if (open) dt.open = true; dt.append(el('summary', '', label || 'פירוט מלא'), b); return dt; };

// ---- header ----
$('ttl').textContent = M.title || S.root;
$('sub').textContent = 'פרויקט: ' + S.root + ' · נסרק ' + S.scannedAt.slice(0, 16).replace('T', ' ') + ' UTC';
const sev = (s) => S.health.filter((h) => h.severity === s).length;
[['סוכנים', S.counts.agents], ['סקילים', S.counts.skills], ['Hooks', S.counts.hooks], ['כלי פרויקט', S.counts.scripts], ['קבצי חוקים', S.counts.rulesFiles], ['ממצאי בריאות', S.health.length]].forEach(([l, v]) => { const k = el('div', 'kpi'); k.append(el('b', '', v), l); $('kpis').append(k); });

// ---- tabs ----
const TABS = [['flow', 'זרימה'], ['agents', 'סוכנים'], ['tools', 'כלים'], ['rules', 'חוקים'], ['health', 'בריאות (' + S.health.length + ')']];
function show(id) { TABS.forEach(([k]) => { $('t-' + k).classList.toggle('on', k === id); const b = $('b-' + k); b.setAttribute('aria-selected', k === id); b.classList.toggle('on', k === id); }); try { history.replaceState(null, '', '#' + id); } catch (e) { } }
TABS.forEach(([k, l]) => { const b = el('button', '', l, { id: 'b-' + k, role: 'tab' }); b.addEventListener('click', () => show(k)); $('tabs').append(b); });

// ---- highlight and jump ----
function hl(ref) {
  document.querySelectorAll('.chip.hl').forEach((c) => c.classList.remove('hl'));
  document.querySelectorAll('.step').forEach((s) => s.classList.remove('dim'));
  if (!ref) return;
  document.querySelectorAll('.chip[data-ref="' + ref + '"]').forEach((c) => c.classList.add('hl'));
  document.querySelectorAll('#t-flow .step').forEach((s) => { if (!s.querySelector('.chip[data-ref="' + ref + '"]')) s.classList.add('dim'); });
}
function jump(ref) {
  const [type, name] = ref.split(':');
  const tab = type === 'agent' ? 'agents' : 'tools'; show(tab);
  const t = document.querySelector('#t-' + tab + ' [data-key="' + name + '"]');
  if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1800); }
}

// ---- flow ----
const KIND = { tool: 'כלי קוד', agent: 'סוכן', user: 'אתה' };
const flow = $('t-flow');
const ctl = el('div', 'ctl');
const bPrev = el('button', '', '◀ הקודם'), bNext = el('button', '', 'הבא ▶'), bPlay = el('button', '', '▶▶ הרצה'), bAll = el('button', 'on', 'הצג הכול');
const hint = el('span', 'sub', 'ריחוף על שם סוכן או כלי מדגיש את כל השלבים שבהם הוא מופיע');
ctl.append(bPrev, bNext, bPlay, bAll, el('span', 'sp'), hint); flow.append(ctl);
const lg = el('div', 'legend'); [['agent', 'סוכן (מודל)'], ['tool', 'כלי קוד'], ['file', 'קובץ פלט'], ['prop', 'מוצע, עוד לא קיים'], ['user', 'אתה']].forEach(([k, l]) => { const s = el('span'); const i = el('i'); i.style.background = 'var(--' + k + '-s)'; s.append(i, l); lg.append(s); }); flow.append(lg);
if (M.orchestrator) { const o = el('div', 'orch'); o.append(el('b', '', M.orchestrator.title), elr('p', '', M.orchestrator.text)); flow.append(o); }
const steps = [];
M.steps.forEach((st, i) => {
  const cn = el('div', 'conn'); cn.append(el('i')); flow.append(cn);
  const box = el('div', 'step k-' + st.kind + (st.proposed ? ' proposed' : ''), null, { 'data-step': i });
  const h = el('h3'); h.append(el('span', 'num', st.id), st.title);
  if (st.proposed) h.append(chip('מוצע', 'prop')); if (st.onDemand) h.append(chip('לפי דרישה', 'user')); if (st.parallel) h.append(chip('במקביל', 'agent')); h.append(chip(KIND[st.kind], st.kind));
  box.append(h, elr('p', '', st.text));
  if (st.agents && st.agents.length) {
    const g = el('div', 'agents2');
    st.agents.forEach((n) => {
      const a = agentOf(n), m = el('div', 'mini');
      m.append(chip(n, 'agent mono', 'agent:' + n));
      if (a) { m.append(chip(a.model ? 'מודל: ' + a.model : 'מודל לא מוגדר', a.model ? '' : 'warn')); const r = el('div', 'row'); r.append(el('span', 'lab', 'כלי Claude Code:')); a.tools.forEach((t) => r.append(chip(t, 'mono', null, TIPS[t]))); m.append(r); }
      else m.append(chip('אין קובץ הגדרה', 'bad'));
      const u = (st.uses || {})[n]; if (u && u.length) { const r = el('div', 'row'); r.append(el('span', 'lab', 'כלי פרויקט:')); u.forEach((s) => r.append(chip(s, 'tool mono', 'script:' + s, scriptDesc(s)))); m.append(r); }
      g.append(m);
    });
    box.append(g);
  }
  if (st.scripts && st.scripts.length) { const r = el('div', 'row'); r.append(el('span', 'lab', 'כלי פרויקט:')); st.scripts.forEach((s) => r.append(chip(s, 'tool mono', 'script:' + s, scriptDesc(s)))); box.append(r); }
  if (st.outputs && st.outputs.length) { const r = el('div', 'row'); r.append(el('span', 'lab', 'פלט:')); st.outputs.forEach((o) => r.append(chip(o, 'file mono'))); box.append(r); }
  const mm = more((DET.steps || {})[st.id], 'פירוט השלב: קלט, פלט, שער מעבר'); if (mm) box.append(mm);
  flow.append(box); steps.push(box);
  (M.loops || []).filter((l) => l.from === st.id).forEach((l) => { const t = M.steps.find((x) => x.id === l.to); flow.append(el('div', 'loop', '↩ חוזר לשלב ' + l.to + (t ? ' (' + t.title + ')' : '') + ': ' + l.label)); });
});
if (steps.length) steps[steps.length - 1].classList.add('last');
let cur = -1, timer = null;
function setStep(i) { cur = i; steps.forEach((s, k) => { s.classList.toggle('active', k === i); s.classList.toggle('dim', i >= 0 && k !== i); }); bAll.classList.toggle('on', i < 0); if (i >= 0) steps[i].scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function stop() { if (timer) { clearInterval(timer); timer = null; bPlay.textContent = '▶▶ הרצה'; } }
bNext.onclick = () => { stop(); setStep(Math.min(steps.length - 1, cur + 1)); };
bPrev.onclick = () => { stop(); setStep(Math.max(0, cur - 1)); };
bAll.onclick = () => { stop(); setStep(-1); };
bPlay.onclick = () => { if (timer) return stop(); bPlay.textContent = '■ עצור'; setStep(0); timer = setInterval(() => { if (cur >= steps.length - 1) return stop(); setStep(cur + 1); }, 1800); };
const stepsOf = (kind, name) => M.steps.filter((s) => (kind === 'agent' ? (s.agents || []) : (s.scripts || []).concat(Object.values(s.uses || {}).flat())).includes(name)).map((s) => s.id);

// ---- agents ----
const ag = $('t-agents');
S.agents.forEach((a) => {
  const c = el('div', 'card', null, { 'data-key': a.name || a.file }), h = el('h3'); h.append(chip(a.name || a.file, 'agent mono'), a.model ? chip('מודל: ' + a.model) : chip('מודל לא מוגדר', 'warn'));
  const st = stepsOf('agent', a.name); if (st.length) h.append(chip('שלב ' + st.join(', ')));
  const heA = (TD.agents || {})[a.name];
  c.append(h, elr('div', 'd', heA || a.description || '(אין תיאור)'));
  if (heA && a.description) { const dt = el('details', 'd'); dt.append(el('summary', '', 'הטקסט המקורי בקובץ ההגדרה (באנגלית)'), el('div', '', a.description)); c.append(dt); }
  let r = el('div', 'row'); r.append(el('span', 'lab', 'כלי Claude Code:')); (a.tools.length ? a.tools : ['(לא הוגדר: יורש הכול)']).forEach((t) => r.append(chip(t, 'mono', null, TIPS[t]))); c.append(r);
  if (a.scripts.length) { r = el('div', 'row'); r.append(el('span', 'lab', 'כלי פרויקט שההגדרה מזכירה:')); a.scripts.forEach((s) => r.append(chip(s, 'tool mono', 'script:' + s, scriptDesc(s)))); c.append(r); }
  if (a.readsRules.length) { r = el('div', 'row'); r.append(el('span', 'lab', 'קורא חוקים:')); a.readsRules.forEach((x) => r.append(chip(x, 'mono'))); c.append(r); }
  if (a.mentionedFiles.length) { r = el('div', 'row'); r.append(el('span', 'lab', 'קבצים שמוזכרים:')); a.mentionedFiles.forEach((x) => r.append(chip(x, 'file mono'))); c.append(r); }
  r = el('div', 'row'); r.append(el('span', 'lab', 'קובץ ההגדרה:'), chip(a.file, 'mono'), el('span', 'sub', a.bodyLines + ' שורות הנחיות')); c.append(r);
  const am = more((DET.agents || {})[a.name], 'פירוט מלא: קלט, שלבי עבודה, פלט, כללים וגבולות', true); if (am) c.append(am);
  ag.append(c);
});
M.steps.filter((s) => s.proposed).forEach((s) => (s.agents || []).filter((n) => !agentOf(n)).forEach((n) => { const c = el('div', 'card prop', null, { 'data-key': n }), h = el('h3'); h.append(chip(n, 'prop mono'), chip('מוצע, אין קובץ הגדרה', 'prop')); c.append(h, el('div', 'd', s.text)); ag.append(c); }));
if (!S.agents.length) ag.append(el('div', 'd', 'לא נמצאו סוכנים ב-.claude/agents'));

// ---- tools ----
const tl = $('t-tools');
const q = el('input', '', null, { type: 'search', placeholder: 'חיפוש כלי...', 'aria-label': 'חיפוש כלי' }); tl.append(q);
const bar = el('div', 'bar'); const bOpen = el('button', '', 'הרחב הכול'), bClose = el('button', '', 'כווץ הכול'); bar.append(bOpen, bClose); tl.append(bar);
const tb = el('table'); const th = el('tr'); ['כלי', 'מה הוא עושה', 'בשלב', 'מוזכר על ידי'].forEach((x) => th.append(el('th', '', x))); tb.append(th);
S.scripts.forEach((s) => {
  const tr = el('tr', '', null, { 'data-key': s.name }), u = s.usedBy;
  const by = []; u.agents.forEach((x) => by.push(['agent', x])); u.scripts.length && by.push(['txt', u.scripts.length + ' כלים']); u.rules.forEach((x) => by.push(['txt', x])); u.launch.forEach((x) => by.push(['txt', 'launch:' + x])); u.hooks.forEach((x) => by.push(['txt', 'hook:' + x]));
  const c1 = el('td'); c1.append(chip(s.name, 'tool mono', 'script:' + s.name)); if (!s.documented) c1.append(chip('ללא תיעוד', 'warn'));
  const c2 = elr('td', '', scriptDesc(s.name) || '—'), c3 = el('td', '', stepsOf('script', s.name).join(', ') || '—'), c4 = el('td');
  if (!by.length) c4.append(chip('לא מוזכר באף מקום', 'warn')); by.forEach(([t, x]) => c4.append(t === 'agent' ? chip(x, 'agent mono', 'agent:' + x) : chip(x)));
  const dd = (DET.scripts || {})[s.name], blk = block(dd, s.headerLines && s.headerLines.length ? s.headerLines : null);
  if (blk) { const tg = el('button', 'tgl', 'פירוט ▾', { 'aria-expanded': 'false' }); c1.append(tg); const dr = el('tr', 'dt', null, { 'data-for': s.name }); dr.style.display = 'none'; const dc = el('td', '', null, { colspan: 4 }); dc.append(blk); dr.append(dc);
    const flip = (on) => { dr.style.display = on ? '' : 'none'; tg.setAttribute('aria-expanded', on); tg.textContent = on ? 'פירוט ▴' : 'פירוט ▾'; tr.dataset.open = on ? '1' : ''; };
    tg.addEventListener('click', () => flip(dr.style.display === 'none')); tr._flip = flip; tr.append(c1, c2, c3, c4); tb.append(tr, dr); return; }
  tr.append(c1, c2, c3, c4); tb.append(tr);
});
const tw = el('div', 'tablewrap'); tw.append(tb); tl.append(tw);
const rows = () => [...tb.querySelectorAll('tr[data-key]')];
bOpen.onclick = () => rows().forEach((r) => r._flip && r._flip(true)); bClose.onclick = () => rows().forEach((r) => r._flip && r._flip(false));
q.addEventListener('input', () => { const v = q.value.toLowerCase(); rows().forEach((r) => { const dr = tb.querySelector('tr[data-for="' + r.dataset.key + '"]'); const hit = (r.textContent + (dr ? dr.textContent : '')).toLowerCase().includes(v); r.style.display = hit ? '' : 'none'; if (dr) dr.style.display = hit && r.dataset.open ? '' : 'none'; }); });
tl.append(el('div', 'd', 'הקישורים מבוססים על הזכרת שם קובץ בטקסט. הם מראים מי מזכיר כלי, לא מוכיחים שהוא מופעל.'));

// ---- rules ----
const ru = $('t-rules');
S.rules.forEach((r) => { const c = el('div', 'card'), h = el('h3'); h.append(chip(r.path, 'mono'), chip(r.lines + ' שורות'), chip(r.numberedItems + ' סעיפים ממוספרים')); c.append(h); if ((TD.rules || {})[r.path]) c.append(el('div', 'd', TD.rules[r.path])); const rd = (DET.rules || {})[r.path];
  if (rd && rd.items) { const sec = el('div', 'blk'); const s2 = el('div', 'sec'); s2.append(el('h4', '', 'הסעיפים')); const ol = el('ol'); rd.items.forEach((x) => ol.append(elr('li', '', x))); s2.append(ol); sec.append(s2); (rd.notes || []).forEach((n) => sec.append(el('p', 'sub', n))); const dt = el('details', 'more'); dt.open = r.path === 'CLAUDE.md'; dt.append(el('summary', '', 'כל הסעיפים בעברית'), sec); c.append(dt); }
  const ul = el('ul', 'h'); r.headings.filter((x) => x.level <= 2).forEach((x) => ul.append(el('li', '', (TD.headings || {})[x.text] || x.text))); c.append(ul); ru.append(c); });
if (!S.rules.length) ru.append(el('div', 'd', 'לא נמצא CLAUDE.md או AGENTS.md'));

// ---- health ----
const HE = {
  'agent-no-model': (h) => 'ל-' + h.subject + ' לא הוגדר מודל (יורש את ברירת המחדל)',
  'agent-no-description': (h) => 'ל-' + h.subject + ' אין תיאור, ולכן המתזמר לא יודע מתי להשתמש בו',
  'agent-no-tools': (h) => 'ל-' + h.subject + ' לא הוגדרה רשימת כלים, ולכן הוא יורש את כולם',
  'agent-no-name': (h) => 'בקובץ ' + h.subject + ' אין שם בכותרת',
  'agent-long': (h) => h.subject + ': הגדרה ארוכה. כדאי להעביר ידע לסקיל. ' + h.message.match(/\((\d+) lines\)/)?.[0],
  'agent-missing-script': (h) => h.subject + ' מזכיר כלי שלא קיים: ' + h.message.split(': ')[1],
  'agent-duplicate-name': (h) => 'שני קבצי סוכן עם אותו שם: ' + h.subject,
  'script-unreferenced': (h) => h.subject + ' לא מוזכר באף סוכן, סקיל, פקודה, hook, קובץ חוקים או כלי אחר',
  'script-undocumented': (h) => h.subject + ' ללא שורת תיעוד בראש הקובץ',
  'flow-script-not-in-agent': (h) => 'הזרימה אומרת ש-' + h.subject + ' משתמש ב-' + (h.message.match(/uses (\S+),/) || [])[1] + ', אבל קובץ ההגדרה שלו לא מזכיר אותו',
  'agent-script-not-in-flow': (h) => 'ההגדרה של ' + h.subject + ' מזכירה את ' + (h.message.match(/mentions (\S+),/) || [])[1] + ', והזרימה לא מפרטת אותו אצלו',
  'manifest-unknown-agent': (h) => h.subject + ': ב-architecture.json מופיע סוכן שאין לו קובץ',
  'manifest-unknown-script': (h) => h.subject + ': ב-architecture.json מופיע כלי שלא קיים',
  'skill-no-description': (h) => 'לסקיל ' + h.subject + ' אין תיאור, ולכן לא יופעל', 'skill-broken': (h) => 'סקיל ' + h.subject + ': ' + h.message,
  'hook-no-command': (h) => 'Hook ' + h.subject + ' בלי פקודה', 'settings-invalid-json': (h) => h.subject + ' אינו JSON תקין',
  'no-rules-file': () => 'לא נמצא CLAUDE.md או AGENTS.md'
};
const hh = $('t-health'); const SEV = [['high', 'גבוה', 'bad'], ['medium', 'בינוני', 'warn'], ['info', 'מידע', '']];
if (!S.health.length) hh.append(el('div', 'd', 'לא נמצאו ממצאים'));
SEV.forEach(([k, l, cls]) => { const items = S.health.filter((h) => h.severity === k); if (!items.length) return; const c = el('div', 'card'); c.append(el('h3', '', l + ' (' + items.length + ')')); items.forEach((h) => { const r = el('div', 'sev'); r.append(chip(l, cls), el('span', '', (HE[h.code] ? HE[h.code](h) : h.message))); c.append(r); }); hh.append(c); });
hh.append(el('div', 'd', 'הבדיקות קוראות קבצים בלבד. הן לא בודקות איכות או נכונות של התוכן.'));

// ---- theme + footer ----
$('theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
$('foot').textContent = 'נוצר מסריקה של קבצי הפרויקט (architecture-explorer). סדר הפעולות והקישור בין שלב לסוכן נקראים מ-.claude/architecture.json, וכל השאר מהקבצים עצמם.';
show((location.hash || '#flow').slice(1).replace(/[^a-z]/g, '') || 'flow');
if (!document.getElementById('b-' + (location.hash || '#flow').slice(1))) show('flow');
</script>
</body>
