og-L.json"]},{"id":"6","kind":"tool","title":"ביקורת ובנייה","text":"טענה מאומתת רק אם ה-hash של הפסיקה זהה לטקסט הנוכחי. אחר כך בונים את הסייר.","scripts":["logic-audit.mjs","mapping-audit.mjs","build-html.mjs","serve.mjs"],"outputs":["out/ssis-explorer.html"]},{"id":"★","kind":"agent","onDemand":true,"title":"עיצוב (לפי דרישה)","text":"משפר מראה ו-UX בלבד. לא נוגע בנתונים, במספרים או במשמעות הטקסט.","agents":["ssis-ui-designer"],"uses":{"ssis-ui-designer":["build-html.mjs"]},"outputs":["tools/theme.css","tools/template.html"]},{"id":"7","kind":"user","title":"בדיקה ואישור","text":"Claude קובע רק technicalVerification. reviewDecision נשאר pending עד שהמשתמש מחליט."}],"descriptions":{"agents":{"ssis-business-logic":"מומחה לחילוץ הלוגיקה העסקית של חבילת SSIS: אוכלוסיות, החלטות, כללי התאמה, ומה נוצר או מתעדכן ב-CRM ומתי. מתעלם מתשתית ETL ומפיק תיאור עסקי בעברית עם ראיות.","ssis-field-lineage":"מומחה לשושלת שדות ל-Dynamics CRM: פותר כל חוליית סקריפט או SQL וממפה כל שדה שנכתב ל-CRM לשדות המקור בקובץ (ולהפך), עם כל שינוי בדרך וראיה ברמת שורה.","ssis-verifier":"בודק עצמאי ומתנגד: מנסה להפריך כל טענת מיפוי או לוגיקה מול ה-DTSX הגולמי והקוד, ומדווח מאומת / שגוי / חסר עם ראיה. לא עורך קבצי ניתוח.","ssis-ui-designer":"מעצב הממשק של הסייר (template.html ו-theme.css): משפר מראה, היררכיה ושימושיות בלי לשנות נתונים, ניסוח עובדות או התנהגות."},"scripts":{"batch-prep.mjs":"הכנה דטרמיניסטית לכל חבילה בתיקייה: חילוץ ← שושלת ← עותקים זהים ← סקירה, ואחר כך שורת מלאי לכל חבילה (כיסוי, מקורות קבצים, כותבי CRM) ב-reports/inventory.json.","build-html.mjs":"בונה את הסייר כקובץ HTML עצמאי מהראיות והניתוח (בלי רשת, הנתונים מוטמעים בקובץ).","claimid.mjs":"מזהים יציבים לטענות על כתיבה ל-CRM, והתאמה דטרמיניסטית של פסיקות הבודק ליעדים.","claims.mjs":"מפרט את טענות המיפוי (מתוך fieldmap.json) שנוצרו מקובץ ניתוח אחד: מזהה יציב, שדות המקור בקובץ ושרשרת הצעדים המלאה.","component.mjs":"מדפיס כל מה שאנליסט צריך על רכיב אחד: מחלקה, חיבורים, תכונות, עמודות קלט ופלט, ביטויים, SQL וקוד C# עם מספרי שורה.","compose.mjs":"מרכיב את מיפוי קובץ↔CRM הסופי לחבילה: אוסף את פתרונות האנליסט, מריץ שוב את lineage ומצרף ל-fieldmap.json.","dtsx-extract.mjs":"מחלץ ראיות מקובץ DTSX. עובדות בלבד, בלי פרשנות; לכל אובייקט יש refId ושורה.","dupes.mjs":"מקבץ רכיבי סקריפט ופקודות OLE DB עם קוד או SQL זהים (אחרי נרמול רווחים) באותו Data Flow, כדי לנתח נציג אחד.","evidence-summary.mjs":"מדפיס סיכום טקסט קומפקטי של קובץ ראיות (לבדיקה, בלי פרשנות).","lineage.mjs":"בונה גרף שושלת עמודות דטרמיניסטי מקובץ הראיות. כל קשת נושאת סוג, רכיב וראיה.","logic-audit.mjs":"ביקורת על התיאורים העסקיים: לכל טענה חייבת להיות פסיקה עצמאית (CONFIRMED או FIXED) שה-hash שלה שווה ל-hash הנוכחי של הטענה.","logic-claims.mjs":"מפרק את ניתוח הלוגיקה העסקית (logic.json) לטענות ניתנות לאימות עם מזהים יציבים. כל יחידת טקסט בסייר שייכת לטענה אחת.","mapping-audit.mjs":"ביקורת על הקשר היחיד קובץ→CRM (ערך שדה בקובץ נכנס לשדה ב-CRM) לכל חבילה שקוראת קובץ. בודק, בין היתר, ששני הכיוונים מסכימים.","origins.mjs":"מדפיס את עץ המקורות לאחור של כל קלט ברכיב כתיבה (מתוך גרף השושלת).","recheck.mjs":"לכל פסיקת בודק שאינה CONFIRMED, מראה מה המיפוי המורכב הנוכחי אומר, כדי להפריד תיקוני כלי מתיקוני אנליסט.","scratch-bw.mjs":"בודק את פריסת מאפיין→אינדקס ב-BufferWrapper של רכיב סקריפט (כלי עזר לפיתוח).","serve.mjs":"שרת סטטי מינימלי לתצוגה מקדימה של out/ (מקומי בלבד).","survey.mjs":"סקירה מבנית קומפקטית של קובץ ראיות: זרימת בקרה, Data Flows, SQL ומועמדי כתיבה."},"rules":{"CLAUDE.md":"כללי העבודה המחייבים של הפרויקט, שהוסכמו עם המשתמש. דיוק קודם לכול.","HANDOFF.md":"איפה עצרנו, איך מקימים במחשב חדש, ומה המשימות הבאות."},"headings":{"SSIS Business-Logic Explorer — Working Rules":"SSIS Business-Logic Explorer: כללי עבודה","Layout":"מבנה התיקיות","Focus (user direction, 2026-11-05)":"מיקוד (הנחיית המשתמש, 5.11.2026)","Rules":"החוקים"}},"loops":[{"from":"6","to":"4","label":"טענה שגויה או ישנה: מתקנים ובודקים שוב (עד 2 סבבים, אחרת נשארת 'לא אומת')"}],"details":{"agents":{"ssis-business-logic":{"goal":"לכתוב תיאור עסקי בעברית של מה שחבילת SSIS עושה: מי האוכלוסייה, איך רשומה מותאמת לרשומה קיימת ב-CRM, אילו החלטות מתקבלות ומה נוצר או מתעדכן, ומה התוצאה העסקית. כל משפט חייב להיות מוכח מהחבילה.","inputs":["evidence/\u003cpkg>.json ו-lineage/\u003cpkg>.lineage.json (נוצרו בשלב 1)","analysis/\u003cpkg>/dupes.json: עותקים זהים, מתוארים פעם אחת עם הערה \"×N מקביליים זהים\"","CLAUDE.md: חוקים שמחייבים אותו","נתיב קובץ הפלט, שנקבע במשימה"],"how":["קורא קודם את CLAUDE.md.","מריץ survey.mjs: זרימת בקרה, אילוצי קדימות, Data Flows ו-SQL.","לכל Data Flow: component.mjs --list לרשימת הרכיבים, ואחר כך component.mjs לכל רכיב רלוונטי (תנאים וקוד C# עם מספרי שורה).","בודק dupes.json ומתאר עותק אחד מכל קבוצה.","כותב קובץ JSON אחד: תקציר, סדר ביצוע, ורשימת רכיבים. לכל רכיב: תיאור קצר, תיאור מפורט, החלטות עם התנאי המצוטט, השפעות על CRM, ראיות ושאלות פתוחות."],"outputs":["analysis/\u003cpkg>/logic.json (קובץ יחיד)","לכל רכיב שני זוגות תצוגה: short.nodes (תיאור + FLOW) ו-detailed.nodes (תיאור מפורט + FLOW מפורט), שנבנים מאותה רשימת צמתים","צמתים מארבעה סוגים: step, decision (עם ענפים מקוננים), write, end","ממצאים (findings_he) עם חומרה: high / medium / low / info"],"rules":["דיוק קודם: אם לא מוכח כותבים \"לא ידוע\" או מסמנים \"(השערה)\".","התיאור הקצר הוא תמצית נאמנה של המפורט ואסור שיסתור אותו.","עברית לתיאורים, שמות טכניים נשארים באנגלית.","לא ממציא תנאים: מצטט אותם מהקוד.","שלב טעינת staging מתואר בשורה אחת בלבד."],"limits":["מתעלם לגמרי מתשתית ETL: gen_etlprocess ו-gen_etlprocesswarning, ETL Warning, Organization Variables, חיפוש system user ל-ModifiedBy בלבד, לוגים, מוני שורות, Set Task Name Variable, ניקוי staging, ארכוב קבצים, עמודות שגיאה ו-Union של שורות שגיאה. הם מוכרזים פעם אחת ב-ignoredAsFramework.","אין לו כלי Edit ואין Agent: הוא כותב קובץ אחד בלבד.","אינו ממפה שדות: זה התפקיד של ssis-field-lineage."]},"ssis-field-lineage":{"goal":"לקבוע לכל שדה ב-CRM שנכתב מאילו שדות בקובץ הוא מגיע, ובאילו שינויים בדרך (Trim, ריפוד, המרת סוג, פענוח תאריך, טבלאות מיפוי, שרשור, ברירות מחדל). שגיאת מיפוי חמורה יותר מ\"לא נפתר\", ולכן קישור שלא הוכח נרשם כ-unresolved.","inputs":["evidence/\u003cpkg>.json ו-lineage/\u003cpkg>.lineage.json","analysis/\u003cpkg>/dupes.json: מנתח נציג אחד ומפרט את העותקים","ה-DTSX הגולמי ב-source/ (לחיפוש בלבד, אף פעם לא מריצים ממנו כלום)","רשימת ה-Data Flows שהוקצו לו"],"how":["component.mjs --list: רכיבי ה-Data Flow והחיבורים ביניהם.","origins.mjs לכל רכיב כתיבה: שושלת דטרמיניסטית לאחור עד שדות הקובץ. הסימון OPEN script-output אומר שיש חוליה שהכלי לא יכול להוכיח.","פותר כל חוליה כזו מהקוד: עוקב אחרי Row.X ו-Buffer.Y דרך משתנים ופונקציות ומצטט קובץ.cs:שורה. ב-OLE DB Command סופר בעצמו את סימני ה-? (מ-0) ומצטט את שורת ה-SQL.","מסווג כל קשר: value (הערך נכנס), key (איתור רשומה בלבד), condition (קובע רק אם הכתיבה תתבצע).","קבוע (fixedValue) רק כשהוא ליטרל בנתיב הכתיבה. GETDATE() הוא ביטוי ולא קבוע.","מצהיר על מסנני שורות שמיושמים בקוד (declaredRowFilters), ועל שינויים במקום בעמודה קיימת (readWriteModifications).","בסוף פותח שוב כל רכיב כתיבה וסופר שכל שדה נכלל ושלא הומצא שדה."],"outputs":["analysis/\u003cpkg>/mapping-*.json","scriptOutputs: חוליות שנפתרו בתוך סקריפטים","crmWrites: ישות, פעולה, מנגנון (SDK או SQL), Supported או Unsupported, מפתח הרשומה, שדות ושינויים","readWriteModifications, lookupBridges, unresolved ו-notes","ההרכבה הסופית ל-fieldmap.json נעשית אחר כך על ידי compose.mjs"],"rules":["רק ערכים שמגיעים ל-CRM (דרך CRM SDK בקוד או SQL על חיבור ה-CRM). יעדים אחרים הם רק חוליות בדרך.","אין קישור לפי דמיון שמות, רק lineageId, refId, פרמטר או זרימת קוד.","לכל שינוי בדרך מצטט את הקוד.","suppressedRowFilters רק עם הוכחה, אף פעם לא לפי תחושה."],"limits":["מתעלם מתשתית ETL כמו business-logic.","לא מריץ שום דבר מ-source/.","לא כותב תיאור עסקי."]},"ssis-verifier":{"goal":"בודק עצמאי שמנסה להפריך. הוא לא כתב את הניתוח, והמשימה שלו היא לחפש טעויות ולא לאשר.","inputs":["טענות מ-node tools/claims.mjs \u003cpkg> \u003cmapping-X.json>: בלוק ### CLAIM \u003cid> לכל שדה CRM, עם שדות המקור (VALUE ו-INFLUENCE) ושרשרת הצעדים","טענות לוגיקה לפי reports/logic-verify-standard.md (logic-claims.mjs)","ה-DTSX הגולמי והקוד","--fields: שדות קובץ שהיעד שלהם דורש בדיקה"],"how":["גוזר כל טענה מחדש מהקוד, ה-SQL וה-DTSX, ולא סומך על מצביע הראיה שבטענה.","בודק: ישות ושדה ב-CRM נכונים, עמודות מקור נכונות, תפקיד (value / key / condition), שינוי מתואר במלואו (Trim, ריפוד, המרות, ברירות מחדל, דריסה בקוד מאוחר), קבוע רק אם ליטרל, תנאי נכון, וספירה נכונה של פרמטרי SQL לפי מיקום.","מחפש מה שחסר: שדות שנכתבים ואינם רשומים, מקורות נוספים, קוד מאוחר שדורס, וכתיבות ברכיבים שלא כוסו.","כותב פסיקה לכל טענה, כולל CONFIRMED.","מסכם בהודעה סופית של עד 400 מילים: WRONG ו-INCOMPLETE קודם, ושורת ספירה."],"outputs":["analysis/\u003cpkg>/verify-*.json: verifier, package, scope, checked, results[], missingWrites[]","פסיקות: CONFIRMED, WRONG, INCOMPLETE, UNVERIFIABLE, כל אחת עם פירוט וראיה (קובץ:שורה או שורת DTSX)"],"rules":["מזהה הטענה מועתק תו בתו משורת ה-### CLAIM. מזהה שלא תואם נזרק, והשדה מוצג כ\"לא אומת\".","פסיקה אחת בדיוק לכל טענה.","סקריפט עזר שהוא כותב חייב להיות בשם ייחודי (חבילה + מטרה + תג משלו), כי ה-scratchpad משותף. לא מריץ סקריפט שלא כתב במשימה הזאת."],"limits":["הקובץ היחיד שמותר לו לכתוב הוא קובץ הפסיקה שהוגדר במשימה.","לא עורך קבצי ניתוח ולא מריץ שום דבר מ-source/.","ההגדרה שלו מתארת בפירוט רק טענות מיפוי. אימות הלוגיקה העסקית מפורט ב-logic-verify-standard.md ולא בקובץ ההגדרה."]},"ssis-ui-designer":{"goal":"לשפר מראה והיררכיה ושימושיות של הסייר בלי לשנות נתונים, מספרים, לוגיקת מיפוי או משמעות של טקסט.","inputs":["tools/theme.css: מערכת העיצוב כולה, טוקנים כמשתני CSS על :root","tools/template.html: מבנה ו-JS, שאליו build-html.mjs מזריק __THEME__ ו-__DATA__","הגדרת explorer ב-.claude/launch.json (שרת על פורט 8765)"],"how":["משנה קודם את הטוקנים והרכיבים ב-theme.css, ונוגע במבנה ה-HTML רק כשחייבים.","בונה מחדש עם build-html.mjs.","פותח בדפדפן ב-1440×900 וב-375 רוחב ומצלם: לוח, זרימת חבילה, טבלה, ישויות CRM, כל לשוניות המיפוי, חלון שרשרת, חיפוש ומגירה.","בודק שאין שגיאות בקונסול ושייצוא Copy/CSV/Excel מייצא נתונים בלבד.","מדווח מה השתנה חזותית ומאשר שלא השתנו נתונים או טקסט."],"outputs":["שינויים ב-tools/theme.css וב-tools/template.html","הסייר הבנוי: out/ssis-explorer.html"],"rules":["עברית ו-RTL; מזהים טכניים, SQL ונתיבים ב-LTR ובגופן קבוע רוחב.","פונט אחד: Arial. אין CDN, אין פונטים ואין תמונות חיצוניות; אייקונים ב-SVG מוטבע.","Supported ו-Unsupported תמיד כתובים במלואם, הצבע אף פעם לא האות היחיד.","לכל טבלה סרגל Copy / CSV / Excel מעליה.","לשוניות עם role=tab, חלונות נסגרים ב-Esc, ו-aria-expanded במתגים.","שורה אחת לכל קשר ייחודי בטבלאות המיפוי."],"limits":["הוא היחיד מהארבעה שיש לו Edit, והוא מוגבל לשכבה הוויזואלית.","לעולם לא משנה נתונים או משמעות טקסט."]}},"scripts":{"batch-prep.mjs":{"goal":"הכנה דטרמיניסטית לכל החבילות בתיקייה בהרצה אחת.","usage":"node tools/batch-prep.mjs source/DailyProcess [skip-pkg ...]","inputs":["תיקייה עם קובצי DTSX","רשימת חבילות לדלג עליהן (אופציונלי)"],"how":["לכל קובץ DTSX: חילוץ ← שושלת עמודות ← עותקים זהים ← סקירה.","אחר כך שורת מלאי לכל חבילה: כיסוי, מקורות קבצים וכותבי CRM."],"outputs":["evidence/\u003cpkg>.json ו-lineage/\u003cpkg>.lineage.json","reports/survey_\u003cpkg>.txt","reports/inventory.json"],"notes":["רץ על כל התיקייה בבת אחת. כדי לעדכן חבילה בודדת מריצים את הכלים שהוא מפעיל בנפרד.","הפלט כולל coverage לכל חבילה: כל ספירה חייבת להיות שווה ל-XML, אחרת החבילה לא נסגרת (כלל 5)."]},"build-html.mjs":{"goal":"בונה את הסייר כקובץ HTML עצמאי.","usage":"node tools/build-html.mjs \u003cout.html> \u003cpkg> [\u003cpkg> ...]","inputs":["evidence/\u003cpkg>.json","analysis/\u003cpkg>/logic.json, fieldmap.json וקובצי verify-*","tools/template.html ו-tools/theme.css"],"how":["קורא את הנתונים של כל חבילה, מצרף את הפסיקות לטענות לפי מזהה, ומזריק הכול לתבנית."],"outputs":["קובץ HTML אחד, בלי רשת: הנתונים מוטמעים בו"],"notes":["שם הקובץ והחבילות הם ארגומנטים."]},"claimid.mjs":{"goal":"מזהים יציבים לטענות על כתיבה ל-CRM, והתאמה דטרמיניסטית של פסיקות הבודק לטענות.","inputs":["יעדי כתיבה מורכבים (targets) ותוצאות בודק (results)"],"how":["מזהה קנוני: \"\u003cשם רכיב הכותב>|\u003cישות>|\u003cפעו י לא יכול להוכיח.","פותר כל חוליה כזו מהקוד: עוקב אחרי Row.X ו-Buffer.Y דרך משתנים ופונקציות ומצטט קובץ.cs:שורה. ב-OLE DB Command סופר בעצמו את סימני ה-? (מ-0) ומצטט את שורת ה-SQL.","מסווג כל קשר: value (הערך נכנס), key (איתור רשומה בלבד), condition (קובע רק אם הכתיבה תתבצע).","קבוע (fixedValue) רק כשהוא ליטרל בנתיב הכתיבה. GETDATE() הוא ביטוי ולא קבוע.","מצהיר על מסנני שורות שמיושמים בקוד (declaredRowFilters), ועל שינויים במקום בעמודה קיימת (readWriteModifications).","בסוף פותח שוב כל רכיב כתיבה וסופר שכל שדה נכלל ושלא הומצא שדה."],"outputs":["analysis/\u003cpkg>/mapping-*.json","scriptOutputs: חוליות שנפתרו בתוך סקריפטים","crmWrites: ישות, פעולה, מנגנון (SDK או SQL), Supported או Unsupported, מפתח הרשומה, שדות ושינויים","readWriteModifications, lookupBridges, unresolved ו-notes","ההרכבה הסופית ל-fieldmap.json נעשית אחר כך על ידי compose.mjs"],"rules":["רק ערכים שמגיעים ל-CRM (דרך CRM SDK בקוד או SQL על חיבור ה-CRM). יעדים אחרים הם רק חוליות בדרך.","אין קישור לפי דמיון שמות, רק lineageId, refId, פרמטר או זרימת קוד.","לכל שינוי בדרך מצטט את הקוד.","suppressedRowFilters רק עם הוכחה, אף פעם לא לפי תחושה."],"limits":["מתעלם מתשתית ETL כמו business-logic.","לא מריץ שום דבר מ-source/.","לא כותב תיאור עסקי."]},"ssis-verifier":{"goal":"בודק עצמאי שמנסה להפריך. הוא לא כתב את הניתוח, והמשימה שלו היא לחפש טעויות ולא לאשר.","inputs":["טענות מ-node tools/claims.mjs \u003cpkg> \u003cmapping-X.json>: בלוק ### CLAIM \u003cid> לכל שדה CRM, עם שדות המקור (VALUE ו-INFLUENCE) ושרשרת הצעדים","טענות לוגיקה לפי reports/logic-verify-standard.md (logic-claims.mjs)","ה-DTSX הגולמי והקוד","--fields: שדות קובץ שהיעד שלהם דורש בדיקה"],"how":["גוזר כל טענה מחדש מהקוד, ה-SQL וה-DTSX, ולא סומך על מצביע הראיה שבטענה.","בודק: ישות ושדה ב-CRM נכונים, עמודות מקור נכונות, תפקיד (value / key / condition), שינוי מתואר במלואו (Trim, ריפוד, המרות, ברירות מחדל, דריסה בקוד מאוחר), קבוע רק אם ליטרל, תנאי נכון, וספירה נכונה של פרמטרי SQL לפי מיקום.","מחפש מה שחסר: שדות שנכתבים ואינם רשומים, מקורות נוספים, קוד מאוחר שדורס, וכתיבות ברכיבים שלא כוסו.","כותב פסיקה לכל טענה, כולל CONFIRMED.","מסכם בהודעה סופית של עד 400 מילים: WRONG ו-INCOMPLETE קודם, ושורת ספירה."],"outputs":["analysis/\u003cpkg>/verify-*.json: verifier, package, scope, checked, results[], missingWrites[]","פסיקות: CONFIRMED, WRONG, INCOMPLETE, UNVERIFIABLE, כל אחת עם פירוט וראיה (קובץ:שורה או שורת DTSX)"],"rules":["מזהה הטענה מועתק תו בתו משורת ה-### CLAIM. מזהה שלא תואם נזרק, והשדה מוצג כ\"לא אומת\".","פסיקה אחת בדיוק לכל טענה.","סקריפט עזר שהוא כותב חייב להיות בשם ייחודי (חבילה + מטרה + תג משלו), כי ה-scratchpad משותף. לא מריץ סקריפט שלא כתב במשימה הזאת."],"limits":["הקובץ היחיד שמותר לו לכתוב הוא קובץ הפסיקה שהוגדר במשימה.","לא עורך קבצי ניתוח ולא מריץ שום דבר מ-source/.","ההגדרה שלו מתארת בפירוט רק טענות מיפוי. אימות הלוגיקה העסקית מפורט ב-logic-verify-standard.md ולא בקובץ ההגדרה."]},"ssis-ui-designer":{"goal":"לשפר מראה והיררכיה ושימושיות של הסייר בלי לשנות נתונים, מספרים, לוגיקת מיפוי או משמעות של טקסט.","inputs":["tools/theme.css: מערכת העיצוב כולה, טוקנים כמשתני CSS על :root","tools/template.html: מבנה ו-JS, שאליו build-html.mjs מזריק __THEME__ ו-__DATA__","הגדרת explorer ב-.claude/launch.json (שרת על פורט 8765)"],"how":["משנה קודם את הטוקנים והרכיבים ב-theme.css, ונוגע במבנה ה-HTML רק כשחייבים.","בונה מחדש עם build-html.mjs.","פותח בדפדפן ב-1440×900 וב-375 רוחב ומצלם: לוח, זרימת חבילה, טבלה, ישויות CRM, כל לשוניות המיפוי, חלון שרשרת, חיפוש ומגירה.","בודק שאין שגיאות בקונסול ושייצוא Copy/CSV/Excel מייצא נתונים בלבד.","מדווח מה השתנה חזותית ומאשר שלא השתנו נתונים או טקסט."],"outputs":["שינויים ב-tools/theme.css וב-tools/template.html","הסייר הבנוי: out/ssis-explorer.html"],"rules":["עברית ו-RTL; מזהים טכניים, SQL ונתיבים ב-LTR ובגופן קבוע רוחב.","פונט אחד: Arial. אין CDN, אין פונטים ואין תמונות חיצוניות; אייקונים ב-SVG מוטבע.","Supported ו-Unsupported תמיד כתובים במלואם, הצבע אף פעם לא האות היחיד.","לכל טבלה סרגל Copy / CSV / Excel מעליה.","לשוניות עם role=tab, חלונות נסגרים ב-Esc, ו-aria-expanded       else m.append(chip('אין קובץ הגדרה', 'bad'));
      const u = (st.uses || {})[n]; if (u && u.length) { const r = el('div', 'row'); r.append(el('span', 'lab', 'כלי פרויקט:')); u.forEach((s) => r.append(chip(s, 'tool mono', 'script:' + s, scriptDesc(s)))); m.append(r); }
      g.append(m);
    });
    box.append(g);
  }
  if (st.scripts && st.scripts.length) { const r = el('div', 'row'); r.append(el('span', 'lab', 'כלי פרויקט:')); st.scripts.forEach((s) => r.append(chip(s, 'tool mono', 'script:' + s, scriptDesc(s)))); box.append(r); }
  if (st.outputs && st.outputs.length) { const r = el('div', 'row'); r.append(el('span', 'lab', 'פלט:')); st.outputs.forEach((o) => r.append(chip(o, 'file mono'))); box.append(r); }
  const mm = more((DET.steps || {})[st.id], 'פירוט השלב: קלט, פלט, שער מעבר'); if (mm) box.append(mm);
  flow.append(box); steps.push(box);
  (M.loops || []).filter((l) => l.from === st.id).forEach((l) => { const t = M.steps.find((x) => x.id === l.to); flow.append(el('div', 'loop', '↩ חוזר לשלב ' + l.to + (t ? ' (' + t.title + ')' : '') + ': ' + l.label)); });
});
if (steps.length) steps[steps.length - 1].classList.add('last');
let cur = -1, timer = null;
function setStep(i) { cur = i; steps.forEach((s, k) => { s.classList.toggle('active', k === i); s.classList.toggle('dim', i >= 0 && k !== i); }); bAll.classList.toggle('on', i < 0); if (i >= 0) steps[i].scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function stop() { if (timer) { clearInterval(timer); timer = null; bPlay.textContent = '▶▶ הרצה'; } }
bNext.onclick = () => { stop(); setStep(Math.min(steps.length - 1, cur + 1)); };
bPrev.onclick = () => { stop(); setStep(Math.max(0, cur - 1)); };
bAll.onclick = () => { stop(); setStep(-1); };
bPlay.onclick = () => { if (timer) return stop(); bPlay.textContent = '■ עצור'; setStep(0); timer = setInterval(() => { if (cur >= steps.length - 1) return stop(); setStep(cur + 1); }, 1800); };
const stepsOf = (kind, name) => M.steps.filter((s) => (kind === 'agent' ? (s.agents || []) : (s.scripts || []).concat(Object.values(s.uses || {}).flat())).includes(name)).map((s) => s.id);

// ---- agents ----
const ag = $('t-agents');
S.agents.forEach((a) => {
  const c = el('div', 'card', null, { 'data-key': a.name || a.file }), h = el('h3'); h.append(chip(a.name || a.file, 'agent mono'), a.model ? chip('מודל: ' + a.model) : chip('מודל לא מוגדר', 'warn'));
  const st = stepsOf('agent', a.name); if (st.length) h.append(chip('שלב ' + st.join(', ')));
  const heA = (TD.agents || {})[a.name];
  c.append(h, elr('div', 'd', heA || a.description || '(אין תיאור)'));
  if (heA && a.description) { const dt = el('details', 'd'); dt.append(el('summary', '', 'הטקסט המקורי בקובץ ההגדרה (באנגלית)'), el('div', '', a.description)); c.append(dt); }
  let r = el('div', 'row'); r.append(el('span', 'lab', 'כלי Claude Code:')); (a.tools.length ? a.tools : ['(לא הוגדר: יורש הכול)']).forEach((t) => r.append(chip(t, 'mono', null, TIPS[t]))); c.append(r);
  if (a.scripts.length) { r = el('div', 'row'); r.append(el('span', 'lab', 'כלי פרויקט שההגדרה מזכירה:')); a.scripts.forEach((s) => r.append(chip(s, 'tool mono', 'script:' + s, scriptDesc(s)))); c.append(r); }
  if (a.readsRules.length) { r = el('div', 'row'); r.append(el('span', 'lab', 'קורא חוקים:')); a.readsRules.forEach((x) => r.append(chip(x, 'mono'))); c.append(r); }
  if (a.mentionedFiles.length) { r = el('div', 'row'); r.append(el('span', 'lab', 'קבצים שמוזכרים:')); a.mentionedFiles.forEach((x) => r.append(chip(x, 'file mono'))); c.append(r); }
  r = el('div', 'row'); r.append(el('span', 'lab', 'קובץ ההגדרה:'), chip(a.file, 'mono'), el('span', 'sub', a.bodyLines + ' שורות הנחיות')); c.append(r);
  const am = more((DET.agents || {})[a.name], 'פירוט מלא: קלט, שלבי עבודה, פלט, כללים וגבולות', true); if (am) c.append(am);
  ag.append(c);
});
M.steps.filter((s) => s.proposed).forEach((s) => (s.agents || []).filter((n) => !agentOf(n)).forEach((n) => { const c = el('div', 'card prop', null, { 'data-key': n }), h = el('h3'); h.append(chip(n, 'prop mono'), chip('מוצע, אין קובץ הגדרה', 'prop')); c.append(h, el('div', 'd', s.text)); ag.append(c); }));
if (!S.agents.length) ag.append(el('div', 'd', 'לא נמצאו סוכנים ב-.claude/agents'));

// ---- tools ----
const tl = $('t-tools');
const q = el('input', '', null, { type: 'search', placeholder: 'חיפוש כלי...', 'aria-label': 'חיפוש כלי' }); tl.append(q);
const bar = el('div', 'bar'); const bOpen = el('button', '', 'הרחב הכול'), bClose = el('button', '', 'כווץ הכול'); bar.append(bOpen, bClose); tl.append(bar);
const tb = el('table'); const th = el('tr'); ['כלי', 'מה הוא עושה', 'בשלב', 'מוזכר על ידי'].forEach((x) => th.append(el('th', '', x))); tb.append(th);
S.scripts.forEach((s) => {
  const tr = el('tr', '', null, { 'data-key': s.name }), u = s.usedBy;
  const by = []; u.agents.forEach((x) => by.push(['agent', x])); u.scripts.length && by.push(['txt', u.scripts.length + ' כלים']); u.rules.forEach((x) => by.push(['txt', x])); u.launch.forEach((x) => by.push(['txt', 'launch:' + x])); u.hooks.forEach((x) => by.push(['txt', 'hook:' + x]));
  const c1 = el('td'); c1.append(chip(s.name, 'tool mono', 'script:' + s.name)); if (!s.documented) c1.append(chip('ללא תיעוד', 'warn'));
  const c2 = elr('td', '', scriptDesc(s.name) || '—'), c3 = el('td', '', stepsOf('script', s.name).join(', ') || '—'), c4 = el('td');
  if (!by.length) c4.append(chip('לא מוזכר באף מקום', 'warn')); by.forEach(([t, x]) => c4.append(t === 'agent' ? chip(x, 'agent mono', 'agent:' + x) : chip(x)));
  const dd = (DET.scripts || {})[s.name], blk = block(dd, s.headerLines && s.headerLines.length ? s.headerLines : null);
  if (blk) { const tg = el('button', 'tgl', 'פירוט ▾', { 'aria-expanded': 'false' }); c1.append(tg); const dr = el('tr', 'dt', null, { 'data-for': s.name }); dr.style.display = 'none'; const dc = el('td', '', null, { colspan: 4 }); dc.append(blk); dr.append(dc);
    const flip = (on) => { dr.style.display = on ? '' : 'none'; tg.setAttribute('aria-expanded', on); tg.textContent = on ? 'פירוט ▴' : 'פירוט ▾'; tr.dataset.open = on ? '1' : ''; };
    tg.addEventListener('click', () => flip(dr.style.display === 'none')); tr._flip = flip; tr.append(c1, c2, c3, c4); tb.append(tr, dr); return; }
  tr.append(c1, c2, c3, c4); tb.append(tr);
});
const tw = el('div', 'tablewrap'); tw.append(tb); tl.append(tw);
const rows = () => [...tb.querySelectorAll('tr[data-key]')];
bOpen.onclick = () => rows().forEach((r) => r._flip && r._flip(true)); bClose.onclick = () => rows().forEach((r) => r._flip && r._flip(false));
q.addEventListener('input', () => { const v = q.value.toLowerCase(); rows().forEach((r) => { const dr = tb.querySelector('tr[data-for="' + r.dataset.key + '"]'); const hit = (r.textContent + (dr ? dr.textContent : '')).toLowerCase().includes(v); r.style.display = hit ? '' : 'none'; if (dr) dr.style.display = hit && r.dataset.open ? '' : 'none'; }); });
tl.append(el('div', 'd', 'הקישורים מבוססים על הזכרת שם קובץ בטקסט. הם מראים מי מזכיר כלי, לא מוכיחים שהוא מופעל.'));

// ---- rules ----
const ru = $('t-rules');
S.rules.forEach((r) => { const c = el('div', 'card'), h = el('h3'); h.append(chip(r.path, 'mono'), chip(r.lines + ' שורות'), chip(r.numberedItems + ' סעיפים ממוספרים')); c.append(h); if ((TD.rules || {})[r.path]) c.append(el('div', 'd', TD.rules[r.path])); const rd = (DET.rules || {})[r.path];
  if (rd && rd.items) { const sec = el('div', 'blk'); const s2 = el('div', 'sec'); s2.append(el('h4', '', 'הסעיפים')); const ol = el('ol'); rd.items.forEach((x) => ol.append(elr('li', '', x))); s2.append(ol); sec.append(s2); (rd.notes || []).forEach((n) => sec.append(el('p', 'sub', n))); const dt = el('details', 'more'); dt.open = r.path === 'CLAUDE.md'; dt.append(el('summary', '', 'כל הסעיפים בעברית'), sec); c.append(dt); }
  const ul = el('ul', 'h'); r.headings.filter((x) => x.level <= 2).forEach((x) => ul.append(el('li', '', (TD.headings || {})[x.text] || x.text))); c.append(ul); ru.append(c); });
if (!S.rules.length) ru.append(el('div', 'd', 'לא נמצא CLAUDE.md או AGENTS.md'));

// ---- health ----
const HE = {
  'agent-no-model': (h) => 'ל-' + h.subject + ' לא הוגדר מודל (יורש את ברירת המחדל)',
  'agent-no-description': (h) => 'ל-' + h.subject + ' אין תיאור, ולכן המתזמר לא יודע מתי להשתמש בו',
  'agent-no-tools': (h) => 'ל-' + h.subject + ' לא הוגדרה רשימת כלים, ולכן הוא יורש את כולם',
  'agent-no-name': (h) => 'בקובץ ' + h.subject + ' אין שם בכותרת',
  'agent-long': (h) => h.subject + ': הגדרה ארוכה. כדאי להעביר ידע לסקיל. ' + h.message.match(/\((\d+) lines\)/)?.[0],
  'agent-missing-script': (h) => h.subject + ' מזכיר כלי שלא קיים: ' + h.message.split(': ')[1],
  'agent-duplicate-name': (h) => 'שני קבצי סוכן עם אותו שם: ' + h.subject,
  'script-unreferenced': (h) => h.subject + ' לא מוזכר באף סוכן, סקיל, פקודה, hook, קובץ חוקים או כלי אחר',
  'script-undocumented': (h) => h.subject + ' ללא שורת תיעוד בראש הקובץ',
  'flow-script-not-in-agent': (h) => 'הזרימה אומרת ש-' + h.subject + ' משתמש ב-' + (h.message.match(/uses (\S+),/) || [])[1] + ', אבל קובץ ההגדרה שלו לא מזכיר אותו',
  'agent-script-not-in-flow': (h) => 'ההגדרה של ' + h.subject + ' מזכירה את ' + (h.message.match(/mentions (\S+),/) || [])[1] + ', והזרימה לא מפרטת אותו אצלו',
  'manifest-unknown-agent': (h) => h.subject + ': ב-architecture.json מופיע סוכן שאין לו קובץ',
  'manifest-unknown-script': (h) => h.subject + ': ב-architecture.json מופיע כלי שלא קיים',
  'skill-no-description': (h) => 'לסקיל ' + h.subject + ' אין תיאור, ולכן לא יופעל', 'skill-broken': (h) => 'סקיל ' + h.subject + ': ' + h.message,
  'hook-no-command': (h) => 'Hook ' + h.subject + ' בלי פקודה', 'settings-invalid-json': (h) => h.subject + ' אינו JSON תקין',
  'no-rules-file': () => 'לא נמצא CLAUDE.md או AGENTS.md'
};
const hh = $('t-health'); const SEV = [['high', 'גבוה', 'bad'], ['medium', 'בינוני', 'warn'], ['info', 'מידע', '']];
if (!S.health.length) hh.append(el('div', 'd', 'לא נמצאו ממצאים'));
SEV.forEach(([k, l, cls]) => { const items = S.health.filter((h) => h.severity === k); if (!items.length) return; const c = el('div', 'card'); c.append(el('h3', '', l + ' (' + items.length + ')')); items.forEach((h) => { const r = el('div', 'sev'); r.append(chip(l, cls), el('span', '', (HE[h.code] ? HE[h.code](h) : h.message))); c.append(r); }); hh.append(c); });
hh.append(el('div', 'd', 'הבדיקות קוראות קבצים בלבד. הן לא בודקות איכות או נכונות של התוכן.'));

// ---- theme + footer ----
$('theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
$('foot').textContent = 'נוצר מסריקה של קבצי הפרויקט (architecture-explorer). סדר הפעולות והקישור בין שלב לסוכן נקראים מ-.claude/architecture.json, וכל השאר מהקבצים עצמם.';
show((location.hash || '#flow').slice(1).replace(/[^a-z]/g, '') || 'flow');
if (!document.getElementById('b-' + (location.hash || '#flow').slice(1))) show('flow');
</script>
