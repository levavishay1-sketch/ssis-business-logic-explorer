  tr.append(c1, c2, c3, c4); tb.append(tr);
});
const tw = el('div', 'tablewrap'); tw.append(tb); tl.append(tw);
q.addEventListener('input', () => { const v = q.value.toLowerCase(); tb.querySelectorAll('tr[data-key]').forEach((r) => { r.style.display = r.textContent.toLowerCase().includes(v) ? '' : 'none'; }); });
tl.append(el('div', 'd', 'הקישורים מבוססים על הזכרת שם קובץ בטקסט. הם מראים מי מזכיר כלי, לא מוכיחים שהוא מופעל.'));

// ---- rules ----
const ru = $('t-rules');
S.rules.forEach((r) => { const c = el('div', 'card'), h = el('h3'); h.append(chip(r.path, 'mono'), chip(r.lines + ' שורות'), chip(r.numberedItems + ' סעיפים ממוספרים')); c.append(h); if ((TD.rules || {})[r.path]) c.append(el('div', 'd', TD.rules[r.path])); const ul = el('ul', 'h'); r.headings.filter((x) => x.level <= 2).forEach((x) => ul.append(el('li', '', (TD.headings || {})[x.text] || x.text))); c.append(ul); ru.append(c); });
if (!S.rules.length) ru.append(el('div', 'd', 'לא נמצא CLAUDE.md או AGENTS.md'));

// ---- health ----
const HE = {
  'agent-no-model': (h) => 'ל-' + h.subject + ' לא הוגדר מודל (יורש את ברירת המחדל)',
  'agent-no-description': (h) => 'ל-' + h.subject + ' אין תיאור, ולכן המתזמר לא יודע מתי להשתמש בו',
  'agent-no-tools': (h) => 'ל-' + h.subject + ' לא הוגדרה רשימת כלים, ולכן הוא יורש את כולם',
  'agent-no-name': (h) => 'בקובץ ' + h.subject + ' אין שם בכותרת',
  'agent-long': (h) => h.subject + ': הגדרה ארוכה. כדאי להעביר ידע לסקיל. ' + h.message.match(/\((\d+) lines\)/)?.[0],
  'agent-missing-script': (h) => h.subject + ' מזכיר כלי שלא קיים: ' + h.message.split(': ')[1],
  'agent-duplicate-name': (h) => 'שני קבצי סוכן עם אותו שם: ' + h.subject,
  'script-unreferenced': (h) => h.subject + ' לא מוזכר באף סוכן, סקיל, פקודה, hook, קובץ חוקים או כלי אחר',
  'script-undocumented': (h) => h.subject + ' ללא שורת תיעוד בראש הקובץ',
  'flow-script-not-in-agent': (h) => 'הזרימה אומרת ש-' + h.subject + ' משתמש ב-' + (h.message.match(/uses (\S+),/) || [])[1] + ', אבל קובץ ההגדרה שלו לא מזכיר אותו',
  'agent-script-not-in-flow': (h) => 'ההגדרה של ' + h.subject + ' מזכירה את ' + (h.message.match(/mentions (\S+),/) || [])[1] + ', והזרימה לא מפרטת אותו אצלו',
  'manifest-unknown-agent': (h) => h.subject + ': ב-architecture.json מופיע סוכן שאין לו קובץ',
  'manifest-unknown-script': (h) => h.subject + ': ב-architecture.json מופיע כלי שלא קיים',
  'skill-no-description': (h) => 'לסקיל ' + h.subject + ' אין תיאור, ולכן לא יופעל', 'skill-broken': (h) => 'סקיל ' + h.subject + ': ' + h.message,
  'hook-no-command': (h) => 'Hook ' + h.subject + ' בלי פקודה', 'settings-invalid-json': (h) => h.subject + ' אינו JSON תקין',
  'no-rules-file': () => 'לא נמצא CLAUDE.md או AGENTS.md'
};
const hh = $('t-health'); const SEV = [['high', 'גבוה', 'bad'], ['medium', 'בינוני', 'warn'], ['info', 'מידע', '']];
if (!S.health.length) hh.append(el('div', 'd', 'לא נמצאו ממצאים'));
SEV.forEach(([k, l, cls]) => { const items = S.health.filter((h) => h.severity === k); if (!items.length) return; const c = el('div', 'card'); c.append(el('h3', '', l + ' (' + items.length + ')')); items.forEach((h) => { const r = el('div', 'sev'); r.append(chip(l, cls), el('span', '', (HE[h.code] ? HE[h.code](h) : h.message))); c.append(r); }); hh.append(c); });
hh.append(el('div', 'd', 'הבדיקות קוראות קבצים בלבד. הן לא בודקות איכות או נכונות של התוכן.'));

// ---- theme + footer ----
$('theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
$('foot').textContent = 'נוצר מסריקה של קבצי הפרויקט (architecture-explorer). סדר הפעולות והקישור בין שלב לסוכן נקראים מ-.claude/architecture.json, וכל השאר מהקבצים עצמם.';
show((location.hash || '#flow').slice(1).replace(/[^a-z]/g, '') || 'flow');
if (!document.getElementById('b-' + (location.hash || '#flow').slice(1))) show('flow');
</script>
</body>
